<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bodySilver" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#ECEFF2"/>
      <stop offset="55%" stop-color="#D2D7E0"/>
      <stop offset="85%" stop-color="#ADB5C2"/>
      <stop offset="100%" stop-color="#8E97A6"/>
    </linearGradient>
    <linearGradient id="goldHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EAD196"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9E7835"/>
    </linearGradient>
    <linearGradient id="glassRoof" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D333F" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#465166" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1E232B" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="wheelRim" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ECEFF2"/>
      <stop offset="60%" stop-color="#8E97A6"/>
      <stop offset="85%" stop-color="#343A46"/>
      <stop offset="100%" stop-color="#14171D"/>
    </radialGradient>
    <linearGradient id="ambientStudio" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF9F6"/>
      <stop offset="70%" stop-color="#F2EFE9"/>
      <stop offset="100%" stop-color="#E2DDD4"/>
    </linearGradient>
    <filter id="carShadow" x="-10%" y="-10%" width="120%" height="150%">
      <feDropShadow dx="0" dy="25" stdDeviation="20" flood-color="#141518" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Studio Background -->
  <rect width="1200" height="600" fill="url(#ambientStudio)"/>
  
  <!-- Architectural Studio Floor Grid / Horizon Line -->
  <line x1="50" y1="460" x2="1150" y2="460" stroke="#D5D0C6" stroke-width="1.5" stroke-dasharray="8 8"/>
  <ellipse cx="600" cy="465" rx="500" ry="25" fill="#000000" opacity="0.12" filter="blur(15px)"/>
  <ellipse cx="600" cy="460" rx="430" ry="12" fill="#000000" opacity="0.2" filter="blur(6px)"/>

  <!-- Car Silhouette Group -->
  <g filter="url(#carShadow)">
    <!-- Aerodynamic Underbody & Diffuser -->
    <path d="M 190 440 L 260 446 L 930 446 L 1025 435 L 1045 425 L 980 432 L 230 432 Z" fill="#1C1E24"/>

    <!-- Main Sculpted Body -->
    <path d="M 175 420 
             C 185 390, 230 365, 310 355
             C 410 345, 470 330, 560 270
             C 630 220, 750 220, 830 280
             C 900 335, 960 365, 1030 380
             C 1055 385, 1070 405, 1045 425
             C 1010 435, 950 440, 890 440
             C 860 410, 800 410, 770 440
             L 420 440
             C 390 410, 330 410, 300 440
             L 190 440 Z" 
          fill="url(#bodySilver)"/>

    <!-- Sculptural Fender Crease & Side Intake Scoop -->
    <path d="M 330 365 C 440 360, 520 375, 620 395 C 690 410, 750 420, 810 410" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.8"/>
    <path d="M 580 340 C 650 360, 690 390, 715 425" fill="none" stroke="#687282" stroke-width="2" opacity="0.7"/>

    <!-- Side Air Intake NACA Duct in Carbon -->
    <path d="M 640 375 Q 710 390 730 420 Q 690 415 650 400 Z" fill="#16181D"/>
    <path d="M 640 375 Q 710 390 730 420" stroke="url(#goldHighlight)" stroke-width="1.5" fill="none"/>

    <!-- Teardrop Glass Cockpit Canopy -->
    <path d="M 525 295 
             C 575 240, 670 230, 765 245 
             C 810 252, 850 280, 865 315 
             C 820 310, 730 305, 630 305 
             C 570 305, 540 300, 525 295 Z" 
          fill="url(#glassRoof)"/>

    <!-- Cockpit A-Pillar & Brushed Titanium Trim -->
    <path d="M 520 300 C 565 245, 650 235, 760 248" fill="none" stroke="url(#goldHighlight)" stroke-width="2.5"/>

    <!-- Active Front Aero Flap (Lower Splitter) -->
    <polygon points="160,428 220,428 210,436 150,436" fill="#181A20" stroke="url(#goldHighlight)" stroke-width="1"/>
    
    <!-- Active Rear Carbon Flap / Winglet -->
    <polygon points="1010,360 1065,348 1075,355 1020,368" fill="#181A20" stroke="url(#goldHighlight)" stroke-width="1.5"/>

    <!-- Jewel LED Headlight Cluster -->
    <ellipse cx="235" cy="385" rx="20" ry="6" fill="#FFFFFF" transform="rotate(-15 235 385)"/>
    <circle cx="230" cy="384" r="3.5" fill="#71D9FF"/>
    <circle cx="242" cy="386" r="3" fill="#71D9FF"/>

    <!-- High-Mounted Quad Exhaust Silhouette at Rear -->
    <circle cx="1040" cy="400" r="6" fill="#1A1C22" stroke="url(#goldHighlight)" stroke-width="1.5"/>
    <circle cx="1048" cy="402" r="6" fill="#1A1C22" stroke="url(#goldHighlight)" stroke-width="1.5"/>
    <circle cx="1040" cy="412" r="6" fill="#1A1C22" stroke="url(#goldHighlight)" stroke-width="1.5"/>
    <circle cx="1048" cy="414" r="6" fill="#1A1C22" stroke="url(#goldHighlight)" stroke-width="1.5"/>

    <!-- Front Wheel Assembly -->
    <g transform="translate(360, 440)">
      <circle cx="0" cy="0" r="65" fill="#14171D"/>
      <circle cx="0" cy="0" r="54" fill="url(#wheelRim)"/>
      <circle cx="0" cy="0" r="44" fill="#1C1F26"/>
      <!-- Gold Ceramic Brake Caliper -->
      <path d="M -30 -30 A 42 42 0 0 1 30 -30 L 22 -20 A 30 30 0 0 0 -22 -20 Z" fill="url(#goldHighlight)"/>
      <!-- Multi-Spoke Titanium Turbofan Wheel -->
      <line x1="0" y1="-44" x2="0" y2="44" stroke="#D0D5DD" stroke-width="3"/>
      <line x1="-44" y1="0" x2="44" y2="0" stroke="#D0D5DD" stroke-width="3"/>
      <line x1="-31" y1="-31" x2="31" y2="31" stroke="#D0D5DD" stroke-width="3"/>
      <line x1="31" y1="-31" x2="-31" y2="31" stroke="#D0D5DD" stroke-width="3"/>
      <circle cx="0" cy="0" r="14" fill="#0C0E12" stroke="url(#goldHighlight)" stroke-width="2"/>
      <text x="0" y="3" fill="#C5A059" font-size="8" font-family="'Cinzel', serif" text-anchor="middle" font-weight="700">A</text>
    </g>

    <!-- Rear Wheel Assembly -->
    <g transform="translate(830, 440)">
      <circle cx="0" cy="0" r="68" fill="#14171D"/>
      <circle cx="0" cy="0" r="56" fill="url(#wheelRim)"/>
      <circle cx="0" cy="0" r="46" fill="#1C1F26"/>
      <!-- Gold Brake Caliper -->
      <path d="M -32 -32 A 44 44 0 0 1 32 -32 L 24 -22 A 32 32 0 0 0 -24 -22 Z" fill="url(#goldHighlight)"/>
      <!-- Multi-Spoke Wheel -->
      <line x1="0" y1="-46" x2="0" y2="46" stroke="#D0D5DD" stroke-width="3.5"/>
      <line x1="-46" y1="0" x2="46" y2="0" stroke="#D0D5DD" stroke-width="3.5"/>
      <line x1="-32" y1="-32" x2="32" y2="32" stroke="#D0D5DD" stroke-width="3.5"/>
      <line x1="32" y1="-32" x2="-32" y2="32" stroke="#D0D5DD" stroke-width="3.5"/>
      <circle cx="0" cy="0" r="15" fill="#0C0E12" stroke="url(#goldHighlight)" stroke-width="2"/>
      <text x="0" y="4" fill="#C5A059" font-size="9" font-family="'Cinzel', serif" text-anchor="middle" font-weight="700">A</text>
    </g>
  </g>

  <!-- Technical Telemetry Watermarks in Crisp Architectural Grey -->
  <text x="70" y="90" font-family="'Cinzel', Georgia, serif" font-size="28" fill="#121316" font-weight="700" letter-spacing="4">ARALDI SP-12 CAELUM</text>
  <text x="70" y="120" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#585D6A" letter-spacing="3">ATMOSPHERIC V12 · CARBO-TITANIUM HP62 · EXPOSED GATED 6-SPEED · MODENA</text>
  <line x1="70" y1="135" x2="480" y2="135" stroke="#C5A059" stroke-width="2"/>
</svg>
