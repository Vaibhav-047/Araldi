<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <linearGradient id="champagneGold" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FFF8E8"/>
      <stop offset="30%" stop-color="#EED9B3"/>
      <stop offset="60%" stop-color="#D6B882"/>
      <stop offset="90%" stop-color="#B79354"/>
      <stop offset="100%" stop-color="#8F6C30"/>
    </linearGradient>
    <linearGradient id="goldHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9E7835"/>
    </linearGradient>
    <linearGradient id="darkGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B1E24" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0E1013" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="ambientStudio" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF9F6"/>
      <stop offset="70%" stop-color="#F2EFE9"/>
      <stop offset="100%" stop-color="#E5E0D5"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#ambientStudio)"/>
  <line x1="50" y1="460" x2="1150" y2="460" stroke="#D5D0C6" stroke-width="1.5" stroke-dasharray="8 8"/>
  <ellipse cx="600" cy="465" rx="540" ry="25" fill="#000000" opacity="0.14" filter="blur(15px)"/>

  <!-- Codalunga Extended Body Silhouette -->
  <g>
    <!-- Extended Longtail Diffuser -->
    <path d="M 160 440 L 250 446 L 980 446 L 1120 420 L 1090 410 L 980 430 L 220 432 Z" fill="#15171C"/>

    <!-- Main Longtail Coachbuilt Form -->
    <path d="M 150 420 
             C 160 385, 215 365, 290 355
             C 380 345, 450 330, 540 270
             C 610 220, 720 220, 800 270
             C 870 315, 960 345, 1080 365
             C 1140 375, 1150 395, 1110 418
             C 1070 435, 980 440, 880 440
             C 850 410, 790 410, 760 440
             L 410 440
             C 380 410, 320 410, 290 440
             L 160 440 Z" 
          fill="url(#champagneGold)"/>

    <!-- Streamlined Teardrop Canopy -->
    <path d="M 505 295 
             C 555 240, 650 230, 755 245 
             C 810 252, 870 290, 920 335 
             C 830 320, 720 310, 610 305 
             C 550 305, 520 300, 505 295 Z" 
          fill="url(#darkGlass)"/>

    <!-- Polished Titanium Extended Exhaust Ports -->
    <circle cx="1115" cy="385" r="7" fill="#181A1F" stroke="#E2DDD4" stroke-width="2"/>
    <circle cx="1115" cy="402" r="7" fill="#181A1F" stroke="#E2DDD4" stroke-width="2"/>

    <!-- Wheels -->
    <g transform="translate(350, 440)">
      <circle cx="0" cy="0" r="65" fill="#14171D"/>
      <circle cx="0" cy="0" r="54" fill="#C5C8CF"/>
      <circle cx="0" cy="0" r="44" fill="#1C1F26"/>
      <circle cx="0" cy="0" r="14" fill="#C5A059"/>
      <line x1="0" y1="-44" x2="0" y2="44" stroke="#FAF9F6" stroke-width="3"/>
      <line x1="-44" y1="0" x2="44" y2="0" stroke="#FAF9F6" stroke-width="3"/>
      <line x1="-31" y1="-31" x2="31" y2="31" stroke="#FAF9F6" stroke-width="3"/>
      <line x1="31" y1="-31" x2="-31" y2="31" stroke="#FAF9F6" stroke-width="3"/>
    </g>

    <g transform="translate(820, 440)">
      <circle cx="0" cy="0" r="67" fill="#14171D"/>
      <circle cx="0" cy="0" r="56" fill="#C5C8CF"/>
      <circle cx="0" cy="0" r="46" fill="#1C1F26"/>
      <circle cx="0" cy="0" r="15" fill="#C5A059"/>
      <line x1="0" y1="-46" x2="0" y2="46" stroke="#FAF9F6" stroke-width="3"/>
      <line x1="-46" y1="0" x2="46" y2="0" stroke="#FAF9F6" stroke-width="3"/>
      <line x1="-32" y1="-32" x2="32" y2="32" stroke="#FAF9F6" stroke-width="3"/>
      <line x1="32" y1="-32" x2="-32" y2="32" stroke="#FAF9F6" stroke-width="3"/>
    </g>
  </g>

  <text x="70" y="90" font-family="'Cinzel', Georgia, serif" font-size="28" fill="#121316" font-weight="700" letter-spacing="4">ARALDI VELOCITÀ CODALUNGA</text>
  <text x="70" y="120" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#585D6A" letter-spacing="3">LONGTAIL COACHBUILD · 1 OF 5 WORLD ALLOCATION · 905 HP V12 · MODENA</text>
  <line x1="70" y1="135" x2="520" y2="135" stroke="#C5A059" stroke-width="2"/>
</svg>
